<!DOCTYPE html>
<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate"> 
    <title>Black Lips | Enterprise ERP</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">CARREGANDO SISTEMA...</div>
    </div>

    <div class="erp-window">
        <header class="toolbar">
            <div class="brand">
                <i class="fa-solid fa-layer-group" style="color: var(--accent-purple);"></i>
                <span>BLACK LIPS ERP</span>
                <span class="version-tag">v6.0 PIXELS</span>
            </div>
            <div class="toolbar-actions">
                <span id="status" class="status-indicator"><i class="fa-solid fa-circle-check"></i> Pronto</span>
                <div class="separator"></div>
                <button class="btn-tool btn-clean" onclick="limpar()" title="Limpar"><i class="fa-solid fa-trash-can"></i></button>
                <button class="btn-tool btn-pdf" onclick="baixarPDF()" title="PDF"><i class="fa-solid fa-file-pdf"></i></button>
                <button class="btn-tool btn-save" onclick="enviarParaNuvem()" title="Salvar"><i class="fa-solid fa-cloud-arrow-up"></i> <span class="btn-text">Salvar</span></button>
            </div>
        </header>

        <div class="data-grid-container" id="printArea">
            <table class="data-grid">
                <thead>
                    <tr>
                        <th style="width: 320px;">DESCRIÇÃO DO PRODUTO</th>
                        <th style="width: 80px; text-align: center;">QTD</th>
                        <th style="width: 120px;">CUSTO (UN)</th>
                        <th style="width: 120px;">VENDA (UN)</th>
                        <th style="width: 130px;">LUCRO TOTAL</th>
                        <th style="width: 100px; text-align: right;">MARGEM</th>
                        <th style="width: 60px;"></th>
                    </tr>
                </thead>
                <tbody id="lista"><tr>
        <td>
            <div class="resizable-box">
                <input type="text" oninput="salvar()" value="">
            </div>
        </td>
        <td>
            <div class="resizable-box">
                <input type="tel" value="1" class="qtd-input" oninput="calcular(this)">
            </div>
        </td>
        <td>
            <div class="resizable-box">
                <input type="tel" placeholder="0,00" oninput="calcular(this)" value="">
            </div>
        </td>
        <td>
            <div class="resizable-box">
                <input type="tel" placeholder="0,00" oninput="calcular(this)" value="">
            </div>
        </td>
        <td class="profit-cell">R$ 0,00</td>
        <td class="margin-cell" style="text-align: right;">0,00%</td>
        <td style="text-align: center;">
            <button class="trash-btn" onclick="apagar(this)"><i class="fa-solid fa-xmark"></i></button>
        </td>
    </tr></tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="2" style="text-align: right; padding-right: 15px;">TOTAIS GERAIS:</td>
                        <td id="totalCusto">R$ 0,00</td>
                        <td id="totalVenda">R$ 0,00</td>
                        <td id="totalLucro" class="profit-cell positive">R$ 0,00</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
            
            <div class="footer-actions">
                <button class="btn-add-row" onclick="novoItem()">
                    <i class="fa-solid fa-plus"></i> Adicionar Nova Linha
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>

</body></html>
