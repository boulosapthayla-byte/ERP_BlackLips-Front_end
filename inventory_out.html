<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Lips ERP - Inventory Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="inventory_out.css">
</head>
<body>

    <div class="sap-breadcrumb">
        <span class="sap-path-link">SAP Easy Access</span>
        <i class="fa-solid fa-angle-right sap-separator"></i>
        <span class="sap-path-current">Z_BLACK_LIPS_MIGO</span>
    </div>

    <div class="erp-window">
        <div class="migo-application-title">
            <i class="fa-solid fa-box-open" style="color: #9d46ff;"></i>
            <span>Saída de Mercadorias | Movimentação de Stock</span>
            <div class="application-actions">
                <button class="btn-top-action"><i class="fa-solid fa-print"></i></button>
                <button class="btn-top-action"><i class="fa-solid fa-circle-question"></i></button>
            </div>
        </div>

        <div class="tree-group">
            <div class="tree-root" onclick="togglePainel()" style="cursor: pointer;">
                <i class="fa-solid fa-chevron-down" id="seta-painel"></i> 
                <span>Painel de Operações Rápidas</span>
            </div>
            
            <div class="action-panel" id="conteudo-painel">
                <div class="action-block">
                    <button class="btn-import btn-pink" onclick="importarEstoque()">
                        <i class="fa-solid fa-file-import"></i> IMPORTAR PEDIDO
                    </button>
                    <div class="action-subtitle">
                        Saída em estoque <span class="badge" id="num-estoque">3</span>
                    </div>
                </div>

                <div class="action-block">
                    <button class="btn-import btn-purple" onclick="importarOrdens()">
                        <i class="fa-solid fa-folder-tree"></i> IMPORTAR ORDENS
                    </button>
                    <div class="action-subtitle">
                        Finalizar pedidos <span class="badge" id="num-ordens">5</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="inventory_out.js"></script>
</body>
</html>
