<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Black Lips | SAP Dark Edition (Hub)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="section_hub.css">

    <script src="section_hub.js" defer></script>
</head>
<body>
    <div id="hub-wrapper" style="display: flex; width: 100%; height: 100vh; flex-direction: column;">

        <div class="sap-top-container">
            <div class="sap-menu-bar">
                <div class="sap-menu-item">Menu</div>
                <div class="sap-menu-item">Processar</div>
                <div class="sap-menu-item">Favoritos</div>
                <div class="sap-menu-item">Suplementos</div>
                <div class="sap-menu-item">Sistema</div>
                <div class="sap-menu-item">Ajuda</div>
            </div>
            <div class="sap-toolbar-bar">
                <button class="sap-tool-btn" style="color:#4caf50;"><i class="fa-solid fa-circle-check"></i></button>
                <input type="text" class="sap-command-field" placeholder="/n V10_START" id="cmd-input">
                <button class="sap-tool-btn"><i class="fa-solid fa-angles-left"></i></button>
                <button class="sap-tool-btn"><i class="fa-regular fa-floppy-disk"></i></button>
                <div class="sap-separator"></div>
                <button class="sap-tool-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="sap-tool-btn" style="color:#ff9800;"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="sap-tool-btn"><i class="fa-solid fa-xmark" style="color:#f44336;"></i></button>
                <div class="sap-separator"></div>
                <button class="sap-tool-btn"><i class="fa-solid fa-print"></i></button>
                <button class="sap-tool-btn"><i class="fa-solid fa-binoculars"></i></button>
                <div style="flex:1;"></div>
                <button class="sap-tool-btn"><i class="fa-solid fa-circle-question" style="color:var(--accent-purple);"></i></button>
            </div>
        </div>

        <div style="display: flex; flex: 1; overflow: hidden;">

            <main class="stage">

                <div id="m1" class="erp-frame">
                    <div class="top-bar" style="background:rgba(187, 134, 252, 0.1); border-bottom: 1px solid var(--accent-purple); color:var(--text-main);">
                        <span style="font-weight: bold; font-family:'JetBrains Mono'; font-size:12px;">SAP Easy Access - <span style="color:var(--accent-purple)" id="header-title">BLACK LIPS ERP</span></span>
                    </div>
                    <div class="layout-tree">
                        <div class="tree-col">
                            <div class="tree-item" onclick="openScreen('home', 'BLACK LIPS ERP')">
                                <i class="fa-solid fa-folder" style="color:#666;"></i> <b>Favoritos</b>
                            </div>
                            
                            <div style="padding-left:15px">
                              <div class="tree-item" onclick="abrirApp('margin_analysis.html')">
                                    <i class="fa-solid fa-star" style="color:var(--accent-purple); font-size:10px;"></i> Matriz de Preço
                                </div>
                            </div>
                            
                            <div style="padding-left:15px">
                                <div class="tree-item" onclick="openScreen('custos', 'Z_COST_center')">
                                    <i class="fa-solid fa-star" style="color:var(--accent-purple); font-size:10px;"></i> Custos Operacionais
                                </div>
                            </div>
                            
                            <div class="tree-item"><i class="fa-solid fa-folder" style="color:#666;"></i> <b>Menu SAP</b></div>
                            <div style="padding-left:15px"><div class="tree-item"><i class="fa-solid fa-angle-right"></i> Logística</div></div>
                            <div style="padding-left:15px"><div class="tree-item"><i class="fa-solid fa-angle-right"></i> Contabilidade</div></div>
                        </div>

                        <div class="content-area" style="background:var(--bg-body); position:relative;">
                            
                            <div id="screen-home" class="screen-content active-screen center-content">
                                <div style="font-size:40px; opacity:0.05; font-weight:bold; color:#fff;">BLACK LIPS</div>
                            </div>

                            <div id="screen-custos" class="screen-content">
                                <h2 style="color:var(--accent-purple); font-size:14px; margin-bottom:10px;">Lançamento de Custos</h2>
                                <table class="fake-grid">
                                    <tr><th>DATA</th><th>TIPO DE CUSTO</th><th>VALOR</th><th>STATUS</th></tr>
                                    <tr><td>03/02</td><td>Infraestrutura</td><td>R$ 800,00</td><td>PAGO</td></tr>
                                    <tr><td>03/02</td><td>Despesa Admin</td><td>R$ 200,00</td><td>ABERTO</td></tr>
                                </table>
                            </div>

                        </div>
                    </div>

            </main>

 </div>
 </div> <iframe id="fullscreen-app" style="display: none; border: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #121212;"></iframe>

</body>
</html>
